[/Script/Soulbound.MatchHostSubsystem]
; Tablero que carga el anfitrión de partida (ruta relativa a Content/). El de 91 casillas (15 por Dominio) es Data/Boards/tablero_15.json,
; el valor inicial del código. Desde el 21/10/2026 se juega con tablero_86.json, el generado con las reglas del 21/10 (seis cuñas
; distintas); tablero_82.json es la primera versión (seis cuñas iguales) y tablero_35.json, el de los tests y la simulación.
; FixedSeed=<n> (de 0 en adelante) fija la semilla de la partida; sin la línea, es aleatoria.
BoardRelativePath=Data/Boards/tablero_86.json
; Telón (S-024, R-PRO-1 precisión): segundos que el prólogo espera a que la presentación suba el telón (fin de la pantalla de carga) antes
; de subirse solo. En PIE sin pantalla de carga es lo que tarda en empezar cada partida. Valor inicial 6.
CurtainTimeoutSeconds=6
; Margen tras subir el telón (ampliación del 3/11): la vista lo trata como bajado y el prólogo no cuenta hasta que pasa. Valor inicial 1.5.
CurtainGraceSeconds=1.5
; Anillo (S-026, decisión del autor del 06/11/2026): con True, el humano juega sus pruebas de habilidad y sus duelos con el anillo (clic
; izquierdo); con False, como antes de S-026: un dummy responde por él al azar y los textos dicen "resuelto al azar". Valor inicial True.
bHumanPlaysSkillTrials=True
; Respiro del anillo (S-042, R-MIN-19): segundos entre empezar la prueba (botón "Empezar", su tecla o la cuenta a cero) y el primer pulso, para
; que la pulsación de empezar no se encadene con la del primer pulso. Valor inicial 0.5. Sustituye al anuncio fijo (RingAnnounceSeconds, 2.5 s
; desde el 14/11/2026), que desaparece: la espera máxima es el dato startWaitSeconds de Data/Match/partida.json (valor inicial 8).
RingStartBreatherSeconds=0.5
; Acta de partida (S-030, R-ACT-9): cada partida deja un archivo de texto con todo lo que pasó (eventos, entradas del humano, anillo, Warden), en
; Saved/<MatchRecordDirectory>/partida-AAAAMMDD-HHMMSS-semilla-N.log. Con False no se crea ni la carpeta. Valores iniciales: True y Partidas.
bWriteMatchRecord=True
MatchRecordDirectory=Partidas

[/Script/Soulbound.BoardViewActor]
; Vista al arrancar (S-022, R-CAM-1): true, sentada en el asiento humano; false, cenital. La tecla C alterna en partida.
bStartSeated=true
; Con la partida terminada, vuelve al menú de UGT, como el botón "Volver al menú" (S-022). No Escape: es la pausa de UGT y en PIE lo
; captura el editor (decisión del autor del 29/10/2026).
ReturnToMenuKey=Enter
ReturnToMenuFontSize=28
; Resultado de la partida en el centro (S-041, R-HUD-8, añadido del autor del 16/11/2026): el texto grande encima del botón "Volver al menú", en letra
; MatchResultFontSize (valor inicial 40), y "o pulsa Intro" debajo, en ReturnToMenuHintFontSize (valor inicial 18). Los dos con el fondo oscuro de
; los paneles, para leerse sobre cualquier parte del tablero (ajuste del autor del 16/11/2026 tras PIE).
MatchResultFontSize=40
ReturnToMenuHintFontSize=18
; Vuelta al menú (S-027, R-MEN-1): el mapa al que llevan "Volver al menú" e Intro al acabar la partida, el menú principal de UGT, el mismo que
; abre su menú de pausa. Vacío o con un mapa que no existe, se vuelve a GameDefaultMap (el lanzador, con los logos) y se dice en el registro.
ReturnToMenuMap=/Game/UltraGameTemplate/Maps/UGT_MainMenuMap.UGT_MainMenuMap
; Paneles (S-027, R-HUD-3): la letra escala con la altura de la pantalla (PanelFontSize a 1080 de alto) y nunca baja de este mínimo, en
; píxeles de pantalla. Valor inicial 9. La petición al jugador y el resultado de la partida van StatusLargeFontScale veces más grandes en el
; panel de estado (valor inicial 1,5).
PanelMinFontSize=9
StatusLargeFontScale=1.5
; Línea del Warden (S-021, R-VOZ-1 sin audio): segundos que se enseña cada frase, o hasta la siguiente línea. Desde S-041 (R-VOZ-6) es el mínimo:
; una frase dura el mayor entre WardenLineSeconds y sus caracteres (con el prefijo, la palabra de corte y, en un corte, la línea pequeña) por
; WardenLineSecondsPerChar (valor inicial 0,065 s, unas quince letras por segundo; 0, todas duran el mínimo).
WardenLineSeconds=6
WardenLineSecondsPerChar=0.065
; Señal de corte (S-041, R-VOZ-8): la línea pequeña bajo la frase de un corte, en letra CutNoteFontSize (valor inicial 18, menor que la de la frase) y
; color neutro CutNoteColor (gris claro 0,8); y la capa oscura del tablero, que da CutDimPulseCount pulsos seguidos (valor inicial 2) de
; CutDimPulseSeconds cada uno (valor inicial 0,08 s): cada pulso aparece con CutDimMaxOpacity (valor inicial 0,85) y se desvanece. Los tres
; valores, probados en PIE. Correcciones del autor del 16/11/2026: un solo pulso de 0,5 en 0,8 s era demasiado sutil, y tres de un tercio de segundo
; seguían parpadeando mientras la ficha se colocaba.
CutNoteFontSize=18
CutNoteColor=(R=0.8,G=0.8,B=0.8,A=1.0)
CutDimMaxOpacity=0.85
CutDimPulseCount=2
CutDimPulseSeconds=0.08
; Orbe del Oráculo (S-041, R-VIS-29): diámetro en cm a su tamaño entero (valor inicial 5; antes 3, constante), altura de su centro sobre la base de la
; ficha del consultante en cm (valor inicial 7, por ajustar en PIE) y latido mientras la consulta espera: periodo en segundos (valor inicial 0,9) y
; escala mínima (valor inicial 0,8).
OracleOrbDiameter=5
OracleOrbHeight=7
OracleOrbPulseSeconds=0.9
OracleOrbPulseMin=0.8
; Feedback visual de la ficha (S-029). El rol se ve en un disco plano bajo la ficha (la carta del kit no se tiñe): EchoTokenColor es el gris de un Eco (RGB lineal; un
; Elegido lleva el color de su Dominio). RoleDiscScale es el diámetro del disco por la huella de la carta (valor inicial 1,8; nunca pasa del borde interior del aro del
; turno ni baja de 1,1 veces la huella), RoleDiscLift la cota de su cara inferior sobre la base de la ficha, en cm (valor inicial 0,1; cada asiento sube 0,01 más que el
; anterior) y RoleDiscBrightness su brillo, de 0 a 1 (valor inicial 1). El aro del turno pulsa con periodo ActiveRingPulseSeconds (valor inicial 1,5; 0, sin pulso)
; entre ActiveRingPulseMin (valor inicial 0,35) y 1 de la intensidad del color del asiento.
EchoTokenColor=(R=0.45,G=0.45,B=0.45,A=1.0)
RoleDiscScale=1.8
RoleDiscLift=0.1
RoleDiscBrightness=1.0
ActiveRingPulseSeconds=1.5
ActiveRingPulseMin=0.35
; Latido de los halos de casilla alcanzable (S-039, R-VIS-26): periodo ReachablePulseSeconds (valor inicial 1,2; 0, sin latido) y brillo mínimo ReachablePulseMin (valor inicial 0,12; con 0,35 el punto apagado se veía demasiado, prueba del 15/11/2026) por el del color del halo; es la función del pulso del aro del turno.
ReachablePulseSeconds=1.2
ReachablePulseMin=0.12
; Destellos al ganar o perder una runa (S-029): segundos de cada uno (valor inicial 1; antes 0,6, demasiado sutil; varios seguidos se encadenan) y sus colores. Hacia dentro es recibir y hacia fuera es perder (punto 8 de la story): al ganar una runa, el aro de la ficha se cierra y el halo de la Fuente se abre, con el color del Dominio de la runa (FlashGainColor, el claro de siempre, solo si el tipo no se conoce); al perderla, el aro de la ficha se abre con FlashLossColor y el halo de la Fuente se cierra con el color de su runa. FlashLossColor es fijo y no el de la runa porque el color se lee antes que el sentido: valor inicial un morado vivo (R 0,55, G 0, B 1; antes rojo, decisión del autor del 13/11/2026).
FlashSeconds=1.0
; Tamaño del destello de una ficha (S-029, corrección del 13/11/2026: era demasiado sutil): diámetro inicial del aro del destello por el del aro del turno (FlashRingScale,
; valor inicial 1,4), su grosor en cm (FlashRingWidth, valor inicial 1,5) y cuánto crece hacia fuera mientras dura, también el halo de la Fuente: al final miden 1 más
; FlashGrowth veces el tamaño inicial (valor inicial 0,8; 0, sin crecer).
FlashRingScale=1.4
FlashRingWidth=1.5
FlashGrowth=0.8
FlashGainColor=(R=1.0,G=1.0,B=1.0,A=1.0)
FlashLossColor=(R=0.55,G=0.0,B=1.0,A=1.0)
; Sello (S-037, R-VIS-24, R-VIS-25): color de su marca, de sus destellos y de la muestra de la leyenda (valor inicial rojo puro, el de "Sellos activos" del panel de
; estado; no el morado de perder) y diámetro del disco de la marca por el de la casilla (SealMarkScale, valor inicial 1,20, igual que el aro de Dominio Olvidado y por debajo del halo
; de alcanzable, 1,35). Con 1,28 el halo blanco apenas asomaba por fuera de la marca en una casilla sellada y alcanzable (prueba del 14/11/2026, Fenrir con Paso Libre).
SealMarkColor=(R=1.0,G=0.0,B=0.0,A=1.0)
SealMarkScale=1.20
; Suelo de un Dominio Olvidado (S-040, R-VIS-27): material del suelo liso de su cuña, con el parámetro Color de M_ColorVertice (lo crea el autor; vacío o
; inexistente, el suelo se pinta como antes, con el material del kit apagado por ForgottenDim, y se dice una vez en el registro), y cuánto se apaga con
; él (valor inicial 0,6; con el 0,3 de las casillas la textura no se leería). La peana no cambia.
ForgottenFloorMaterial=/Game/Art/Tablero/M_SueloOlvidado.M_SueloOlvidado
ForgottenFloorDim=0.6
; Línea de objetivo (S-040, R-HUD-7): su color en el panel de estado (valor inicial un dorado claro, distinto del blanco de las alcanzables, del rojo
; del Sello y del morado de perder). Se llamaba GoalLightColor mientras también era el de la luz de la meta (R-VIS-28), retirada el 16/11/2026 tras PIE.
GoalLineColor=(R=1.0,G=0.82,B=0.35,A=1.0)
; Número de la ficha (S-037, R-VIS-23): alto de la letra en cm (valor inicial 4,0; antes 1,4, y 2,0 se quedó corto en la prueba del 13/11/2026) y altura sobre lo alto de la ficha en cm (valor inicial 0,6). Valores a ciegas:
; se ajustan en PIE a 1024x768 en la vista sentada.
TokenLabelSize=4.0
TokenLabelHeight=0.6
; Carta del Elegido (S-029): segundos que se enseña al vincularse el jugador (valor inicial 6; antes, si hace clic o abre el Grimorio), ancho máximo en unidades de
; Slate (valor inicial 560) y fracción del alto de pantalla que se deja libre abajo para el panel de decisión y la frase del Warden (valor inicial 0,3).
ElectCardSeconds=6
ElectCardMaxWidth=560
ElectCardBottomFraction=0.3
; Panel de decisión (S-033): líneas de la frase del Warden que se reservan siempre bajo el panel, para que no se mueva (valor inicial 2), y segundos
; del reloj de partida que enseña el resultado de una votación al cerrarse (valor inicial 5) y el desenlace de un duelo, un dilema, un trilero o la
; prueba de otro asiento (OutcomeSeconds, valor inicial 4).
WardenLineReservedLines=2
VoteResultSeconds=5
OutcomeSeconds=4
; Halo del Altar (S-033, R-DEC-12): su cota en cm (valor inicial 3,17: KitFloorHeight 3,1 más 0,07, la de las demás casillas; el Altar va a cota 0 y el
; relieve de la tierra llega a 3,9, así que más abajo el halo queda tapado) y cuánto sobresale de su pieza por la mayor de sus medidas (valor inicial 1,1).
AltarHaloZ=3.17
AltarHaloMargin=1.1
; Panel del anillo (S-026): segundos que enseña "superada" o "fallada" (en el duelo, la barra y las marcas) al cerrarse la prueba, y letra de su título.
; Valores iniciales 2 y 20.
RingResultSeconds=2
RingFontSize=20
; Textura de la runa del panel del anillo (S-031, R-VIS-18): blanca sobre transparente, la tiñe el panel. La importa el autor; vacía o inexistente, el panel
; pinta un disco relleno del mismo color y lo dice una vez en el registro.
RingRuneTexture=/Game/Art/Anillo/T_RunaAnillo.T_RunaAnillo
; Dado del panel de decisión (S-039, R-DEC-15): textura con las seis caras en una fila, del 1 al 6 (la importa el autor más adelante; vacía o inexistente, la cara se dibuja por código y se dice una vez en el registro), lado de la cara en unidades de Slate (valor inicial 44), colores del dado dibujado por código (valores iniciales marfil y casi negro) y segundos del aviso de casilla inalcanzable (R-DEC-16; valor inicial 4).
DiceFacesTexture=/Game/Art/Dados/T_DadoCaras.T_DadoCaras
DiceFaceSize=44
DiceFaceColor=(R=0.92,G=0.92,B=0.88,A=1.0)
DiceFacePipColor=(R=0.08,G=0.08,B=0.1,A=1.0)
UnreachableNoticeSeconds=4
; Color y opacidad de la franja verde de la zona buena (S-031, R-VIS-14): RGB lineal y alfa. Valor inicial (0,2, 0,9, 0,3) con opacidad 0,55; la anchura
; no se configura, sale de la zona buena.
RingZoneColor=(R=0.2,G=0.9,B=0.3,A=0.55)
; Vista sentada (S-019, R-VIS-9), ajustada por el autor el 21/10/2026 para que la mesa entera quepa en pantalla.
SeatedViewHeight=180
SeatedViewDistance=75
SeatedViewPitchDegrees=48
SeatedViewYawDegrees=180
; Mesa y luz (S-019, R-VIS-1 y R-VIS-7), ajustadas por el autor el 21/10/2026 para que el tablero de 86 deje sitio al decorado.
LayoutParams=(TableRadius=120,KitFloorHeight=3.1)
LampIntensityCandelas=1000
LampInnerConeDegrees=22
LampOuterConeDegrees=32
LampHeight=260

